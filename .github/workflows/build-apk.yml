name: Build iCam APK

on:
  push:
    paths:
      - 'iCam-native.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          if [ ! -f iCam-native.zip ]; then
            echo "::error::Upload the original iCam-native.zip file to the repository root first."
            exit 1
          fi

      - name: Extract original project
        run: unzip -o iCam-native.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p iCam assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCam-debug-apk
          path: iCam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
